<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Final Scroll</title>
  <link rel="stylesheet" href="anniv2/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div id="loader">
    <div class="loader-content">
      <i class="fas fa-compact-disc fa-spin fa-3x"></i>
      <p>Loading... <span id="progress">0%</span></p>
      <div class="bar"><div class="fill" id="fill-bar"></div></div>
    </div>
  </div>

  <div id="opening-screen" style="display:none;">
    <h1>Happy Anniversary 2nd Years! ❤</h1>
    <button onclick="enterSite()">Hope you like it!</button>
  </div>

  <div id="main-content" style="display: none;">
    <button id="toggle-music">⏸</button>

    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/1.jpeg" class="floating" style="top:10%;left:10%;opacity:0.3">
        <img src="anniv2/assets/2.jpeg" class="floating" style="top:15%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #1</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/3.jpeg" class="floating" style="top:20%;left:10%;opacity:0.3">
        <img src="anniv2/assets/4.jpeg" class="floating" style="top:30%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #2</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/5.jpeg" class="floating" style="top:30%;left:10%;opacity:0.3">
        <img src="anniv2/assets/6.jpeg" class="floating" style="top:45%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #3</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/7.jpg" class="floating" style="top:40%;left:10%;opacity:0.3">
        <img src="anniv2/assets/8.jpg" class="floating" style="top:60%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #4</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/9.jpg" class="floating" style="top:50%;left:10%;opacity:0.3">
        <img src="anniv2/assets/10.jpg" class="floating" style="top:5%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #5</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/11.jpg" class="floating" style="top:60%;left:10%;opacity:0.3">
        <img src="anniv2/assets/12.jpg" class="floating" style="top:20%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #6</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/12.jpg" class="floating" style="top:0%;left:10%;opacity:0.3">
        <img src="anniv2/assets/12.jpg" class="floating" style="top:35%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #7</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/12.jpg" class="floating" style="top:10%;left:10%;opacity:0.3">
        <img src="anniv2/assets/12.jpg" class="floating" style="top:50%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #8</div>
      </div>
    </section>
    
    <section class="showcase">
      <div class="wrapper">
        <img src="anniv2/assets/12.jpg" class="floating" style="top:20%;left:10%;opacity:0.3">
        <img src="anniv2/assets/12.jpg" class="floating" style="top:65%;left:60%;opacity:0.4">
        <div class="center-box">This is caption #9</div>
      </div>
    </section>
    

    <!-- Video Section -->
    <section class="showcase">
      <div class="wrapper">
        <video controls width="480" class="center-video">
          <source src="assets/video.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div class="center-box">Final video scene</div>
      </div>
    </section>
  </div>

  <audio id="bg-music" src="assets/music.mp3" loop></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="anniv2/script.js"></script>
</body>
</html>
